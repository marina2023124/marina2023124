name: 微信小程序 CI

on:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "job-agent-miniprogram/**"
      - ".github/workflows/miniprogram-ci.yml"
      - ".github/scripts/miniprogram/**"
  pull_request:
    paths:
      - "job-agent-miniprogram/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview 或 upload"
        required: false
        default: preview
        type: choice
        options:
          - preview
          - upload

concurrency:
  group: miniprogram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: 预览并生成二维码
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'preview'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: job-agent-miniprogram/package-lock.json

      - name: 安装 miniprogram-ci
        working-directory: job-agent-miniprogram
        run: |
          npm install
          mkdir -p node_modules/miniprogram-ci/node_modules
          ln -sf ../../less node_modules/miniprogram-ci/node_modules/less

      - name: 生成预览二维码
        env:
          WECHAT_UPLOAD_KEY: ${{ secrets.WECHAT_UPLOAD_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/miniprogram/ci-preview.js

      - name: 上传二维码（下载后微信扫码）
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-preview-qrcode
          path: preview-qrcode.png
          retention-days: 7

      - name: 预览说明
        run: |
          echo "## 如何扫码体验" >> "$GITHUB_STEP_SUMMARY"
          echo "1. 下载 Artifacts 里的 \`miniprogram-preview-qrcode\`" >> "$GITHUB_STEP_SUMMARY"
          echo "2. 微信扫描 png 二维码" >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: 上传体验版
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'upload')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: job-agent-miniprogram/package-lock.json

      - name: 安装 miniprogram-ci
        working-directory: job-agent-miniprogram
        run: |
          npm install
          mkdir -p node_modules/miniprogram-ci/node_modules
          ln -sf ../../less node_modules/miniprogram-ci/node_modules/less

      - name: 上传到微信后台（体验版）
        env:
          WECHAT_UPLOAD_KEY: ${{ secrets.WECHAT_UPLOAD_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node .github/scripts/miniprogram/ci-upload.js

      - name: 体验版说明
        run: |
          echo "## 体验版已更新" >> "$GITHUB_STEP_SUMMARY"
          echo "微信公众平台 → 版本管理 → 体验版 → 扫码" >> "$GITHUB_STEP_SUMMARY"
